name: sermil-maps

# =============================================================================
# Ordem de inicialização garantida por healthchecks:
#   oracle → n8n → backend → frontend
#
# Primeira execução: Oracle XE leva 2-4 min para inicializar.
# O stack inteiro estará disponível em ~5 min na primeira vez.
# Execuções seguintes são mais rápidas (dados já persistidos no volume).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Oracle XE 21c
  # Scripts em ./docker/oracle/init/ são executados na primeira inicialização.
  # ---------------------------------------------------------------------------
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: sermil_oracle
    environment:
      ORACLE_PASSWORD:    ${ORACLE_SYS_PASSWORD}
      APP_USER:           ${ORACLE_APP_USER}
      APP_USER_PASSWORD:  ${ORACLE_APP_PASSWORD}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
    ports:
      - "1521:1521"     # exposto para conexão via SQL Developer durante o desenvolvimento
    healthcheck:
      test:         ["CMD", "healthcheck.sh"]
      interval:     30s
      timeout:      15s
      retries:      15
      start_period: 120s    # Oracle XE precisa de ~2 min para subir pela primeira vez

  # ---------------------------------------------------------------------------
  # n8n — Importa workflows e executa queries no Oracle
  # ---------------------------------------------------------------------------
  n8n:
    build:
      context:    ./docker/n8n
      dockerfile: Dockerfile
    container_name: sermil_n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - DB_TYPE=sqlite
      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      # Execuções de workflows guardadas por 7 dias
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n/workflows:/home/node/workflows:ro
    ports:
      - "5678:5678"     # admin UI disponível em http://localhost:5678
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval:     20s
      timeout:      10s
      retries:      8
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend Express — traduz REST → webhooks n8n → Oracle
  # ---------------------------------------------------------------------------
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: sermil_backend
    environment:
      - PORT=5000
      - NODE_ENV=production
      - N8N_BASE_URL=http://n8n:5678
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:3000
      - COND_ID=${COND_ID}
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:5000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval:     15s
      timeout:      5s
      retries:      5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend React/Nginx — build estático + proxy /api/* para o backend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context:    .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_USE_MOCK: "false"
        VITE_API_URL:  "/api"
        VITE_COND_ID:  "${COND_ID}"
    container_name: sermil_frontend
    ports:
      - "3000:80"       # aplicação disponível em http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy

# =============================================================================
# Volumes persistentes
# NUNCA delete oracle_data em produção — contém todo o banco.
# =============================================================================
volumes:
  oracle_data:
    name: sermil_oracle_data
  n8n_data:
    name: sermil_n8n_data

networks:
  default:
    name: sermil_network
